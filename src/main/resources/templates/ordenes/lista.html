<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Órdenes de trabajo')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <div class="fila">
        <h2 th:text="${sesionActual.esMecanico()} ? 'Mis órdenes' : 'Órdenes de trabajo'">Órdenes de trabajo</h2>
        <div style="text-align: right;" th:unless="${sesionActual.esMecanico()}">
            <a th:href="@{/ordenes/nueva}" role="button">Nueva orden</a>
        </div>
    </div>
    <form method="get" role="search">
        <select name="estado" aria-label="Estado">
            <option value="">Todos los estados</option>
            <option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}" th:selected="${e == estado}"></option>
        </select>
        <button type="submit">Filtrar</button>
    </form>
    <div class="overflow-auto">
        <table class="striped">
            <thead><tr><th>#</th><th>Estado</th><th>Vehículo</th><th>Cliente</th><th>Mecánico</th><th>Creada</th><th class="numero">Total</th><th></th></tr></thead>
            <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="${o.id()}"></td>
                <td><span class="estado" th:text="${o.estado().etiqueta}"></span></td>
                <td th:text="${o.placa()} + ' · ' + ${o.vehiculo()}"></td>
                <td th:text="${o.cliente()}"></td>
                <td th:text="${o.mecanico()}"></td>
                <td th:text="${#temporals.format(o.fechaCreacion(), 'dd/MM/yyyy HH:mm')}"></td>
                <td class="numero" th:text="${o.total() != null} ? 'Q ' + ${#numbers.formatDecimal(o.total(), 1, 'COMMA', 2, 'POINT')} : '—'"></td>
                <td><a th:href="@{/ordenes/{id}(id=${o.id()})}" role="button" class="secondary">Ver</a></td>
            </tr>
            <tr th:if="${ordenes.isEmpty()}"><td colspan="8">No hay órdenes para mostrar.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
