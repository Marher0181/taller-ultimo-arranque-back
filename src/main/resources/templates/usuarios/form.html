<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${form == null} ? 'Nuevo usuario' : 'Editar usuario')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <h2 th:text="${form == null} ? 'Nuevo usuario' : 'Editar usuario ' + ${form.username()}"></h2>
    <form method="post" th:action="${form == null} ? @{/usuarios} : @{/usuarios/{id}(id=${form.id()})}">
        <div class="fila" th:if="${form == null}">
            <label>Usuario <input name="username" required minlength="3" maxlength="50" autocomplete="off"></label>
            <label>Contraseña
                <input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
                <small>Entre 8 y 72 caracteres, con letras y números.</small>
            </label>
        </div>
        <label>Nombre <input name="nombre" th:value="${form?.nombre()}" required maxlength="120"></label>
        <div class="fila">
            <label>Rol
                <select name="rol" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}"
                            th:selected="${form != null and form.rol() == r}"></option>
                </select>
            </label>
            <label>Mecánico vinculado (solo rol Mecánico)
                <select name="idMecanico">
                    <option value="">Ninguno</option>
                    <option th:each="m : ${mecanicos}" th:value="${m.id()}" th:text="${m.codigo()} + ' · ' + ${m.nombre()}"
                            th:selected="${form != null and m.id() == form.idMecanico()}"></option>
                </select>
            </label>
        </div>
        <button type="submit">Guardar</button>
        <a th:href="@{/usuarios}">Cancelar</a>
    </form>
</main>
</body>
</html>
