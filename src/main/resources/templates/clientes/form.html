<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${form == null} ? 'Nuevo cliente' : 'Editar cliente')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <h2 th:text="${form == null} ? 'Nuevo cliente' : 'Editar cliente'"></h2>
    <form method="post" th:action="${form == null} ? @{/clientes} : @{/clientes/{id}(id=${form.id()})}">
        <div class="fila">
            <label>Tipo de documento
                <select name="tipoDocumento" required>
                    <option th:each="t : ${tiposDocumento}" th:value="${t}" th:text="${t}"
                            th:selected="${form != null and form.tipoDocumento() == t}"></option>
                </select>
            </label>
            <label>Número de documento
                <input name="numeroDocumento" th:value="${form?.numeroDocumento()}" required maxlength="20">
            </label>
        </div>
        <label>Nombre <input name="nombre" th:value="${form?.nombre()}" required maxlength="120"></label>
        <div class="fila">
            <label>Teléfono <input name="telefono" th:value="${form?.telefono()}" maxlength="20"></label>
            <label>Correo <input type="email" name="correo" th:value="${form?.correo()}" maxlength="120"></label>
        </div>
        <label>Dirección <input name="direccion" th:value="${form?.direccion()}" maxlength="200"></label>
        <button type="submit">Guardar</button>
        <a th:href="@{/clientes}">Cancelar</a>
    </form>
</main>
</body>
</html>
