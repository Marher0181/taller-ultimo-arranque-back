<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${form == null} ? 'Nuevo repuesto' : 'Editar repuesto')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <h2 th:text="${form == null} ? 'Nuevo repuesto' : 'Editar repuesto'"></h2>
    <form method="post" th:action="${form == null} ? @{/repuestos} : @{/repuestos/{id}(id=${form.id()})}">
        <div class="fila">
            <label>Código <input name="codigo" th:value="${form?.codigo()}" required maxlength="30"></label>
            <label>Nombre <input name="nombre" th:value="${form?.nombre()}" required maxlength="100"></label>
        </div>
        <label>Descripción <input name="descripcion" th:value="${form?.descripcion()}" maxlength="255"></label>
        <div class="fila">
            <label>Precio (Q) <input type="number" name="precio" th:value="${form?.precio()}" required min="0" step="0.01"></label>
            <label th:if="${form == null}">Existencia inicial <input type="number" name="existencia" required min="0" value="0"></label>
        </div>
        <p th:if="${form != null}"><small>La existencia se modifica con «Abastecer» o al asignar repuestos a una orden.</small></p>
        <button type="submit">Guardar</button>
        <a th:href="@{/repuestos}">Cancelar</a>
    </form>
</main>
</body>
</html>
