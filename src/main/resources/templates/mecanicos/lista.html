<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Mecánicos')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <div class="fila">
        <h2>Mecánicos</h2>
        <div style="text-align: right;"><a th:href="@{/mecanicos/nuevo}" role="button">Nuevo mecánico</a></div>
    </div>
    <div class="overflow-auto">
        <table class="striped">
            <thead><tr><th>Código</th><th>Nombre</th><th>Especialidad</th><th>Teléfono</th><th></th></tr></thead>
            <tbody>
            <tr th:each="m : ${mecanicos}">
                <td th:text="${m.codigo()}"></td>
                <td th:text="${m.nombre()}"></td>
                <td th:text="${m.especialidad()}"></td>
                <td th:text="${m.telefono()}"></td>
                <td>
                    <a th:href="@{/reportes/ordenes-por-mecanico/pdf(idMecanico=${m.id()})}" target="_blank"
                       role="button" class="outline">Órdenes</a>
                    <a th:href="@{/mecanicos/{id}/editar(id=${m.id()})}" role="button" class="secondary">Editar</a>
                    <form th:action="@{/mecanicos/{id}/eliminar(id=${m.id()})}" method="post"
                          onsubmit="return confirm('¿Eliminar este mecánico?')">
                        <button type="submit" class="secondary outline">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${mecanicos.isEmpty()}"><td colspan="5">No hay mecánicos registrados.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
