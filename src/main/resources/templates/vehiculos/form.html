<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${form == null} ? 'Nuevo vehículo' : 'Editar vehículo')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <h2 th:text="${form == null} ? 'Nuevo vehículo' : 'Editar vehículo'"></h2>
    <form method="post" th:action="${form == null} ? @{/vehiculos} : @{/vehiculos/{id}(id=${form.id()})}"
          th:with="idCliente=${form != null ? form.idCliente() : idClienteSugerido}">
        <label>Cliente
            <select name="idCliente" required>
                <option value="">Seleccione un cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.id()}"
                        th:text="${c.nombre()} + ' (' + ${c.documentoFormateado()} + ')'"
                        th:selected="${c.id() == idCliente}"></option>
            </select>
        </label>
        <div class="fila">
            <label>Placa <input name="placa" th:value="${form?.placa()}" required maxlength="10"></label>
            <label>Marca <input name="marca" th:value="${form?.marca()}" required maxlength="50"></label>
            <label>Modelo <input name="modelo" th:value="${form?.modelo()}" required maxlength="50"></label>
        </div>
        <div class="fila">
            <label>Año <input type="number" name="anio" th:value="${form?.anio()}" required min="1900" max="2100"></label>
            <label>Color <input name="color" th:value="${form?.color()}" maxlength="30"></label>
        </div>
        <button type="submit">Guardar</button>
        <a th:href="@{/vehiculos}">Cancelar</a>
    </form>
</main>
</body>
</html>
