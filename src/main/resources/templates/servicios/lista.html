<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Servicios')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container" th:with="puedeEditar=${sesionActual.rol().name() != 'MECANICO'}">
    <div class="fila">
        <h2>Servicios del taller</h2>
        <div style="text-align: right;" th:if="${puedeEditar}">
            <a th:href="@{/servicios/nuevo}" role="button">Nuevo servicio</a>
        </div>
    </div>
    <div class="overflow-auto">
        <table class="striped">
            <thead><tr><th>Código</th><th>Descripción</th><th class="numero">Mano de obra</th><th th:if="${puedeEditar}"></th></tr></thead>
            <tbody>
            <tr th:each="s : ${servicios}">
                <td th:text="${s.codigo()}"></td>
                <td th:text="${s.descripcion()}"></td>
                <td class="numero" th:text="'Q ' + ${#numbers.formatDecimal(s.costoManoObra(), 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:if="${puedeEditar}">
                    <a th:href="@{/servicios/{id}/editar(id=${s.id()})}" role="button" class="secondary">Editar</a>
                </td>
            </tr>
            <tr th:if="${servicios.isEmpty()}"><td colspan="4">No hay servicios registrados.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
