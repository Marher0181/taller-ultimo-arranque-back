<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${form == null} ? 'Nuevo servicio' : 'Editar servicio')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <h2 th:text="${form == null} ? 'Nuevo servicio' : 'Editar servicio'"></h2>
    <form method="post" th:action="${form == null} ? @{/servicios} : @{/servicios/{id}(id=${form.id()})}">
        <div class="fila">
            <label>Código <input name="codigo" th:value="${form?.codigo()}" required maxlength="20"></label>
            <label>Mano de obra (Q)
                <input type="number" name="costoManoObra" th:value="${form?.costoManoObra()}" required min="0" step="0.01">
            </label>
        </div>
        <label>Descripción <input name="descripcion" th:value="${form?.descripcion()}" required maxlength="150"></label>
        <button type="submit">Guardar</button>
        <a th:href="@{/servicios}">Cancelar</a>
    </form>
</main>
</body>
</html>
