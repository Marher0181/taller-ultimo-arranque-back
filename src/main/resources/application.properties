spring.application.name=taller-ultimo-arranque
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taller_ultimo_arranque}?serverTimezone=America/Guatemala&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never

spring.jackson.time-zone=America/Guatemala

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

taller.inventario.umbral-bajo=5
taller.facturacion.tasa-iva=0.12
taller.cors.origenes-permitidos=*

taller.seguridad.jwt.secreto=${JWT_SECRET:clave-de-desarrollo-taller-ultimo-arranque-2026-cambiar-en-produccion}
taller.seguridad.jwt.duracion=30m
taller.seguridad.jwt.emisor=taller-ultimo-arranque
